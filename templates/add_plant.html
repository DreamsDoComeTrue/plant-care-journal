{% extends 'base.html' %}{% block title %}Add plant · Verdant{% endblock %}{% block content %}
<div class="form-shell"><a class="back" href="{{ url_for('index') }}">← Back to garden</a><h1>Add a new plant</h1><p class="muted">Create a profile and start a recurring care schedule.</p><form method="post"><label>Plant nickname<input name="name" required placeholder="e.g. Sunny"></label><label>Species<input name="species" placeholder="e.g. Monstera deliciosa"></label><div class="two"><label>Light<select name="light"><option>Bright indirect</option><option>Medium indirect</option><option>Low light</option><option>Direct sun</option></select></label><label>Water every (days)<input name="watering_interval" type="number" min="1" value="7" required></label></div><button class="button" type="submit">Save plant</button></form></div>
{% endblock %}
