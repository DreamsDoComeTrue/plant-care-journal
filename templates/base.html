<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Verdant Plant Journal{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header"><div class="wrap nav"><a class="brand" href="{{ url_for('index') }}">verdant <span>✦</span></a><a class="nav-link" href="{{ url_for('add_plant') }}">＋ Add plant</a></div></header>
  <main class="wrap">{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
</body>
</html>
